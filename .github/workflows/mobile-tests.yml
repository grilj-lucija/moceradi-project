name: Mobile Tests

on:
  push:
    branches: [ main, mqtt-integration ]
    paths: [ 'mobile/**', '.github/workflows/mobile-tests.yml' ]
  pull_request:
    branches: [ main, mqtt-integration ]
    paths: [ 'mobile/**', '.github/workflows/mobile-tests.yml' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Prepare env
        working-directory: ./mobile
        run: cp .env.example .env

      - name: Analyze
        working-directory: ./mobile
        run: flutter analyze

      - name: Run tests
        working-directory: ./mobile
        run: flutter test
