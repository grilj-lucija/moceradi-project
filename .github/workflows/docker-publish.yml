name: Docker Publish

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: react-app
            context: react-app
            dockerfile: react-app/Dockerfile
          - service: scraper
            context: scraper
            dockerfile: scraper/Dockerfile
          - service: foodai
            context: foodai
            dockerfile: foodai/server/Dockerfile
          - service: mobile
            context: mobile
            dockerfile: mobile/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile exists
        id: check
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping ${{ matrix.service }} - ${{ matrix.dockerfile }} not found on this branch"
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/healthapp-${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/healthapp-${{ matrix.service }}:${{ github.sha }}
          build-args: |
            REACT_APP_SUPABASE_URL=${{ secrets.REACT_APP_SUPABASE_URL }}
            REACT_APP_SUPABASE_KEY=${{ secrets.REACT_APP_SUPABASE_KEY }}
