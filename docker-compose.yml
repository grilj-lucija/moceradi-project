services:
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: health-mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt-broker/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  foodai:
    build:
      context: ./foodai
      dockerfile: server/Dockerfile
    container_name: health-foodai
    restart: unless-stopped
    ports:
      - "8000:8000"

  react-app:
    build:
      context: ./react-app
      args:
        REACT_APP_SUPABASE_URL: ${REACT_APP_SUPABASE_URL}
        REACT_APP_SUPABASE_KEY: ${REACT_APP_SUPABASE_KEY}
    container_name: health-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - mqtt-broker
      - foodai

  scraper:
    build:
      context: ./scraper
    container_name: health-scraper
    env_file:
      - ./scraper/.env

  mobile:
    build:
      context: ./mobile
    container_name: health-mobile-apk
    restart: unless-stopped
    ports:
      - "8080:80"
    profiles:
      - mobile

volumes:
  mosquitto-data:
  mosquitto-log:
